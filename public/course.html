<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course • STUDY PREMIUM COURSE</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark">S</div><div><strong>STUDY PREMIUM COURSE</strong><small>COURSE PLAYER</small></div></div><button class="icon-btn" onclick="location.href='/account.html'">←</button></header><main class="account-shell"><section class="account-card"><h1 id="courseTitle">Course</h1><p id="courseProgress" class="small-muted">Loading progress…</p><div id="lessonList"></div></section></main><script src="/config.js"></script><script>const t=localStorage.getItem('spc_user_token')||'';const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){if(!t||!id)return location.href='/account.html';try{const d=await api('/api/course/'+id);document.getElementById('courseTitle').textContent=d.batch.name;render(d)}catch(e){alert(e.message);location.href='/account.html'}}function render(d){document.getElementById('courseProgress').textContent='Progress: '+d.progress+'%';document.getElementById('lessonList').innerHTML=(d.lessons||[]).map(l=>`<div class="account-card"><div style="display:flex;gap:12px;align-items:center"><input type="checkbox" ${l.completed?'checked':''} onchange="mark('${l._id}',this.checked)"><div style="flex:1"><b>${esc(l.title)}</b><div class="small-muted">${esc(l.description)}</div>${l.videoUrl?`<a href="${esc(l.videoUrl)}" target="_blank">▶️ Watch video</a>`:''}${l.materialUrl?`<div><a href="${esc(l.materialUrl)}" target="_blank">📄 Study material</a></div>`:''}</div></div></div>`).join('')||'<p class="small-muted">No lessons added by admin yet.</p>'}async function mark(lessonId,completed){try{const d=await api('/api/course/'+id+'/progress',{method:'POST',body:JSON.stringify({lessonId,completed})});document.getElementById('courseProgress').textContent='Progress: '+d.progress+'%'}catch(e){alert(e.message)}}load();</script></body></html>
